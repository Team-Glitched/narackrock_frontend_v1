worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite's content-hashed output can be cached across releases.
        location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.[^/]+$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Missing static resources must not become successful HTML responses.
        location ~ ^/(assets|audio|fonts|figma)(/|$) {
            try_files $uri =404;
        }

        location ~* \.(html|js|mjs|css|map|json|webmanifest|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|eot|mp3|wav|ogg|m4a|mp4|webm)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
