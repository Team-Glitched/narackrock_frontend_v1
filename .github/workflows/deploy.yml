name: Build frontend image and update GitOps

# Pull requests validate the app and build an image without publishing.
# Main builds publish to GHCR and pin the image digest for Argo CD.
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'production-deployment' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve frontend build configuration
        id: configuration
        env:
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            # This value is only for unpublished PR image builds, never production.
            GOOGLE_CLIENT_ID=ci-only-not-a-real-google-client-id.apps.googleusercontent.com
          elif [[ -z "${GOOGLE_CLIENT_ID//[[:space:]]/}" ]]; then
            echo '::error::Set the VITE_GOOGLE_CLIENT_ID repository variable before building or publishing a non-PR image.'
            exit 1
          fi
          printf 'google-client-id=%s\n' "${GOOGLE_CLIENT_ID}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.narackrock.com' }}
            VITE_GOOGLE_CLIENT_ID=${{ steps.configuration.outputs.google-client-id }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: parafara/narackrock-deploy
          ref: main
          fetch-depth: 0
          # The write deploy key is scoped to this deployment repository only.
          ssh-key: ${{ secrets.NARACKROCK_DEPLOY_KEY }}
          path: deploy

      - name: Update frontend deployment image by digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          # The API and the frontend share the narackrock Deployment; only the web image line matches.
          file=deploy/kubernetes/deployment.yaml
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected digest: '${DIGEST}'"; exit 1; }
          # Rewrite exactly one matching image line, retaining indentation and comments.
          pattern="^([[:space:]]*image:[[:space:]]+)${IMAGE//./\\.}[@:][^[:space:]#]+([[:space:]]*(#.*)?)$"
          matches="$(grep -cE "${pattern}" "${file}" || true)"
          [[ "${matches}" == 1 ]] || { echo "Expected one ${IMAGE} image line, found ${matches}"; exit 1; }
          sed -i -E "s|${pattern}|\\1${IMAGE}@${DIGEST}\\2|" "${file}"
          grep -qF "${IMAGE}@${DIGEST}" "${file}"
          git -C deploy config user.name 'github-actions[bot]'
          git -C deploy config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C deploy add kubernetes/deployment.yaml
          if git -C deploy diff --cached --quiet; then
            echo 'Deployment already references this image digest.'
            exit 0
          fi
          git -C deploy commit -m "chore: deploy narackrock-frontend ${GITHUB_SHA}"
          # Incorporate backend-bot changes without overwriting its deployment update.
          # Any rebase or subsequent push conflict remains a visible workflow failure.
          git -C deploy pull --rebase origin main
          git -C deploy push origin HEAD:main
