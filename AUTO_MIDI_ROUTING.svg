<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1490" viewBox="0 0 1440 1490"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#94a3b8"/></marker></defs><rect width="1440" height="1490" fill="#0d1424"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#e2e8f0}.title{font-size:30px;font-weight:700}.lane{font-size:24px;font-weight:700}.small{font-size:17px;fill:#a9b8d0}.body{font-size:19px}.nodeTitle{font-size:22px;font-weight:700}</style><text x="55" y="52" class="title" text-anchor="start">녹음 → 자동 MIDI 변환 → 다음 마디 코드 추천 → 저장</text><text x="55" y="84" class="small" text-anchor="start">신호 규칙으로 변환 엔진 선택 · 현재 초안과 다른 레이어로 화성 추천</text><rect x="40" y="110" width="400" height="1305" rx="24" fill="#141e31" stroke="#2d3d57"/><text x="240.0" y="145" class="lane" text-anchor="middle">프론트엔드</text><rect x="490" y="110" width="380" height="1305" rx="24" fill="#141e31" stroke="#2d3d57"/><text x="680.0" y="145" class="lane" text-anchor="middle">Spring 백엔드</text><rect x="920" y="110" width="480" height="1305" rx="24" fill="#141e31" stroke="#2d3d57"/><text x="1160.0" y="145" class="lane" text-anchor="middle">Python 추론 서버</text><rect x="70" y="180" width="340" height="125" rx="16" fill="#243951" stroke="#465a77"/><text x="240.0" y="214" class="nodeTitle" text-anchor="middle">녹음 · MIDI로 변환</text><text x="240.0" y="245" class="small" text-anchor="middle">녹음 오디오를 WAV로 준비</text><text x="240.0" y="270" class="small" text-anchor="middle">기본값: 자동 판별 (AUTO)</text><rect x="520" y="180" width="320" height="125" rx="16" fill="#243951" stroke="#465a77"/><text x="680.0" y="214" class="nodeTitle" text-anchor="middle">인증 · 프로젝트 권한</text><text x="680.0" y="245" class="small" text-anchor="middle">소유자 / 편집 참여자 확인</text><text x="680.0" y="270" class="small" text-anchor="middle">프로젝트 BPM · PPQ 전달</text><rect x="950" y="180" width="420" height="125" rx="16" fill="#243951" stroke="#465a77"/><text x="1160.0" y="214" class="nodeTitle" text-anchor="middle">FFmpeg 디코딩</text><text x="1160.0" y="245" class="small" text-anchor="middle">전체 녹음을 공통 PCM으로 변환</text><text x="1160.0" y="270" class="small" text-anchor="middle">60초 / 파일 크기 제한</text><path d="M410 242H520" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M840 242H950" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="970" y="355" width="380" height="155" rx="16" fill="#26354e" stroke="#465a77"/><text x="1160.0" y="389" class="nodeTitle" text-anchor="middle">신호 규칙 분석</text><text x="1160.0" y="420" class="small" text-anchor="middle">배음 묶음 · 주기성 · 어택/감쇠</text><text x="1160.0" y="445" class="small" text-anchor="middle">전체 구간과 마지막 짧은 화음 검사</text><text x="1160.0" y="470" class="small" text-anchor="middle">무음·손상 파일은 입력 오류</text><path d="M1160 305V355" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="945" y="570" width="185" height="100" rx="16" fill="#1c4854" stroke="#465a77"/><text x="1037.5" y="604" class="nodeTitle" text-anchor="middle">HTI</text><text x="1037.5" y="635" class="small" text-anchor="middle">단선율 근거</text><rect x="1165" y="570" width="210" height="100" rx="16" fill="#463665" stroke="#465a77"/><text x="1270.0" y="604" class="nodeTitle" text-anchor="middle">Basic Pitch</text><text x="1270.0" y="635" class="small" text-anchor="middle">다중음 · 어택 · 모호함</text><text x="1270.0" y="660" class="small" text-anchor="middle">ONNX · 별도 Python</text><path d="M1060 510V540H1038V570" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1260 510V540H1270V570" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="950" y="735" width="420" height="100" rx="16" fill="#26354e" stroke="#465a77"/><text x="1160.0" y="769" class="nodeTitle" text-anchor="middle">공통 노트 JSON</text><text x="1160.0" y="800" class="small" text-anchor="middle">midiNotes + 선택 엔진·이유</text><path d="M1038 670V705H1160V735" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1270 670V705H1160" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="735" width="320" height="100" rx="16" fill="#243951" stroke="#465a77"/><text x="680.0" y="769" class="nodeTitle" text-anchor="middle">변환 결과 응답</text><text x="680.0" y="800" class="small" text-anchor="middle">입력 오류와 서버 오류 구분</text><rect x="70" y="735" width="340" height="100" rx="16" fill="#243951" stroke="#465a77"/><text x="240.0" y="769" class="nodeTitle" text-anchor="middle">피아노롤 개인 초안</text><text x="240.0" y="800" class="small" text-anchor="middle">추출 노트 편집 · MIDI 직접 입력</text><path d="M950 785H840" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 785H410" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="380" class="body" text-anchor="middle">입력 소리의 판별과</text><text x="240" y="410" class="body" text-anchor="middle">재생 MIDI 악기 선택은 별도</text><text x="240" y="475" class="small" text-anchor="middle">자동 결과를 수정할 때만</text><text x="240" y="505" class="small" text-anchor="middle">허밍 / 악기 방식 지정</text><text x="680" y="390" class="small" text-anchor="middle">추론 요청은 HTTP/1.1</text><text x="680" y="420" class="small" text-anchor="middle">연결 · 응답 제한 시간 적용</text><text x="680" y="500" class="body" text-anchor="middle">한 모델만 실행</text><text x="680" y="530" class="small" text-anchor="middle">악기 워커 실패 시</text><text x="680" y="557" class="small" text-anchor="middle">HTI로 강제 대체하지 않음</text><rect x="70" y="885" width="340" height="125" rx="16" fill="#1e4146" stroke="#465a77"/><text x="240.0" y="919" class="nodeTitle" text-anchor="middle">추천 문맥 구성</text><text x="240.0" y="950" class="small" text-anchor="middle">현재 초안 + 다른 레이어 노트</text><text x="240.0" y="975" class="small" text-anchor="middle">프로젝트 전체 tick으로 정렬</text><text x="240.0" y="1000" class="small" text-anchor="middle">편집 클립의 저장본은 초안으로 대체</text><rect x="520" y="900" width="320" height="115" rx="16" fill="#243951" stroke="#465a77"/><text x="680.0" y="934" class="nodeTitle" text-anchor="middle">프로젝트 · 레이어 조회</text><text x="680.0" y="965" class="small" text-anchor="middle">조성 · 박자 · PPQ · 저장 노트</text><text x="680.0" y="990" class="small" text-anchor="middle">연결된 오디오 분석 노트 재사용</text><path d="M240 835V885" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 950H410" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="950" y="935" width="420" height="145" rx="16" fill="#243951" stroke="#465a77"/><text x="1160.0" y="969" class="nodeTitle" text-anchor="middle">오디오 레이어의 분석 노트</text><text x="1160.0" y="1000" class="small" text-anchor="middle">기존 HTI / Basic Pitch 분석 경로</text><text x="1160.0" y="1025" class="small" text-anchor="middle">원본 오디오와 연결해 저장·재사용</text><text x="1160.0" y="1050" class="small" text-anchor="middle">노트 편집마다 오디오 추론하지 않음</text><path d="M950 1005H900V950H840" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="1055" width="340" height="135" rx="16" fill="#1e4146" stroke="#465a77"/><text x="240.0" y="1089" class="nodeTitle" text-anchor="middle">다음 마디 코드 추천</text><text x="240.0" y="1120" class="small" text-anchor="middle">프론트의 음악 이론 규칙 · 점수</text><text x="240.0" y="1145" class="small" text-anchor="middle">조성·진행·멜로디·베이스·성부 이동</text><text x="240.0" y="1170" class="small" text-anchor="middle">편집 레이어의 다음 마디가 비면 추천</text><path d="M240 1010V1055" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="1240" width="340" height="145" rx="16" fill="#32415d" stroke="#465a77"/><text x="240.0" y="1274" class="nodeTitle" text-anchor="middle">3개 후보 · 반투명 미리보기</text><text x="240.0" y="1305" class="small" text-anchor="middle">후보 변경은 미리보기만 변경</text><text x="240.0" y="1330" class="small" text-anchor="middle">명시적 적용 시 코드 전체를 추가</text><text x="240.0" y="1355" class="small" text-anchor="middle">적용 전 저장·일반 재생에는 제외</text><path d="M240 1190V1240" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="1280" width="320" height="105" rx="16" fill="#243951" stroke="#465a77"/><text x="680.0" y="1314" class="nodeTitle" text-anchor="middle">기존 저장 API → DB</text><text x="680.0" y="1345" class="small" text-anchor="middle">추가한 노트의 편집·저장</text><path d="M410 1330H520" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="680" y="1130" class="body" text-anchor="middle">MIDI 편집 · 코드 추천에서는</text><text x="680" y="1160" class="small" text-anchor="middle">오디오 모델을 다시 실행하지 않음</text><text x="1160" y="1160" class="body" text-anchor="middle">코드 추천 기능은 기존 별도 PR</text><text x="1160" y="1190" class="small" text-anchor="middle">추천 계산 위치: 프론트엔드</text><text x="1160" y="1220" class="small" text-anchor="middle">Python은 오디오 → 노트 추출 담당</text><text x="55" y="1450" class="small" text-anchor="start">자동 변환(이번 작업) + 코드 추천(기존 기능 PR)을 함께 적용한 전체 구조 · 운영 배포 전</text></svg>